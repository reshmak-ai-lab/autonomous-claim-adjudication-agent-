services:

  # ==========================================================
  # Claim Adjudication API
  # ==========================================================

  claim-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: claim-adjudication-agent

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: claim-adjudication-redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


# ============================================================
# Persistent volumes
# ============================================================

volumes:

  redis_data: